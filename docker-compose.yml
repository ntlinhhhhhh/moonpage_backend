services:
  diary-api:
    build:
      context: .
      dockerfile: Dockerfile 
    ports:
      - "${API_PORT:-8000}:8080"
    # Tự động nạp tất cả biến từ file .env vào container
    env_file:
      - .env
    environment:
      # Ghi đè các giá trị cần thay đổi khi chạy trong Docker
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Redis__ConnectionString=${DOCKER_REDIS_URL:-diary-redis:6379}
      - RabbitMQSettings__Url=${DOCKER_RABBITMQ_URL:-amqp://guest:guest@diary-rabbitmq:5672}
      - GoogleCloud__ServiceAccountPath=${CONTAINER_KEY_PATH:-/app/firebase-key.json}
      - GOOGLE_APPLICATION_CREDENTIALS=${CONTAINER_KEY_PATH:-/app/firebase-key.json}
      
    volumes:
      - ${HOST_KEY_PATH:-./DiaryApp.API/firebase-key.json}:${CONTAINER_KEY_PATH:-/app/firebase-key.json}:ro
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped 

  redis:
    image: redis:alpine
    container_name: diary-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: diary-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  rabbitmq_data:
